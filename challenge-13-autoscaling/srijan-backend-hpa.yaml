apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: srijan-backend-hpa
  namespace: srijan-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: srijan-backend-api
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60