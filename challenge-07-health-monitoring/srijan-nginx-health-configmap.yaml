apiVersion: v1
kind: ConfigMap
metadata:
  name: srijan-nginx-health-conf
  namespace: srijan-dev
data:
  default.conf: |
    server {
      listen 80;
      server_name localhost;

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
      }

      location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
      }

      location /ready {
        access_log off;
        return 200 "ready\n";
        add_header Content-Type text/plain;
      }
    }